name: Runner probe

# Temporary. A job with no `uses:` at all tells apart two causes of a job
# that dies in seconds with no logs: an actions policy refusing marketplace
# or even first-party actions, versus the runner never starting.
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "the runner started and ran a shell step"
