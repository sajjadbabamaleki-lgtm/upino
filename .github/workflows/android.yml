name: Android build

# Builds an installable APK on every push, so the app can be tried on a real
# phone without anyone setting up Flutter or the Android SDK locally.
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  apk:
    name: APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app

      # Debug signing, so the APK installs without a release key. Fine for
      # trying the app; a store build needs its own signing config.
      - run: flutter build apk --debug
        working-directory: app

      - uses: actions/upload-artifact@v4
        with:
          name: upino-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
