name: Android build

# Builds an installable APK on every push, so the app can be tried on a real
# phone without anyone setting up Flutter or the Android SDK locally.
#
# Flutter is installed by cloning it rather than through a marketplace action:
# a private repository may refuse third-party actions, and that refusal shows
# up as a job that dies in seconds with no logs at all.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_HOME: ${{ github.workspace }}/.flutter

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Flutter
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_HOME }}
          key: flutter-stable-${{ runner.os }}-v1

      - name: Install Flutter
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$FLUTTER_HOME"

      - name: Put Flutter on PATH
        run: |
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          echo "$FLUTTER_HOME/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Warm up Flutter
        run: |
          git config --global --add safe.directory "$FLUTTER_HOME"
          flutter --version
          flutter precache --android

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      # Debug signing, so the APK installs without a release key. Fine for
      # trying the app; a store build needs its own signing config.
      - name: Build APK
        working-directory: app
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: upino-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Artifacts are only reachable from the desktop web UI and arrive
      # wrapped in a zip. A release gives a plain .apk link that a phone can
      # download and open directly, which is the whole point of building it.
      - name: Publish to the latest-android release
        if: github.ref_name == 'claude/v1-to-v2-improvements-075f22'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/app/outputs/flutter-apk/app-debug.apk upino.apk

          # A moving tag keeps one stable download URL across builds.
          gh release delete latest-android --yes --cleanup-tag || true
          gh release create latest-android upino.apk \
            --title "Upino — latest Android build" \
            --notes "Debug-signed build of ${{ github.sha }}.

          Download **upino.apk** below and open it on an Android phone.
          Android asks once to allow installing from this source.

          The app requests no permissions and makes no network calls." \
            --target "${{ github.sha }}" 
