name: upino
description: Upino — a planning-first personal finance app. Flutter client and Dart engine.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3
